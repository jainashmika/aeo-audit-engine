# AEO Audit Engine: one command brings up the whole stack with a seeded demo.
#   docker compose up --build        -> http://localhost:3000
# First boot downloads FinBERT + all-mpnet-base-v2 (~1.3 GB) into the `models` volume.
# Slim, model-free variant:  INSTALL_ML=false NLP_MODE=lite docker compose up --build

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aeo
      POSTGRES_PASSWORD: aeo
      POSTGRES_DB: aeo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeo -d aeo"]
      interval: 5s
      timeout: 3s
      retries: 30

  nlp-worker:
    build:
      context: .
      dockerfile: nlp-worker/Dockerfile
      args:
        INSTALL_ML: ${INSTALL_ML:-true}
    environment:
      DATABASE_URL: postgresql://aeo:aeo@db:5432/aeo
      DEMO_BASE_URL: http://nlp-worker:8000/demo-sites
      NLP_MODE: ${NLP_MODE:-auto}
      RENDER_MODE: ${RENDER_MODE:-auto}
      SEVERANCE_THRESHOLD: "0.75"
      SEED_ON_START: "true"
    volumes:
      - models:/models
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  orchestrator:
    build: ./orchestrator
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/aeo
      SPRING_DATASOURCE_USERNAME: aeo
      SPRING_DATASOURCE_PASSWORD: aeo
      AEO_WORKER_URL: http://nlp-worker:8000
      AEO_WEBHOOK_SECRET: ${AEO_WEBHOOK_SECRET:-change-me}
      DEMO_BASE_URL: http://nlp-worker:8000/demo-sites
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
      nlp-worker: { condition: service_started }

  dashboard:
    build: ./frontend
    environment:
      API_URL: http://orchestrator:8080
    ports: ["3000:3000"]
    depends_on: [orchestrator]

volumes:
  pgdata:
  models:
